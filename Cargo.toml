[package]
name = "seviathstudio"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Draw, rig, animate and stream a 2D character from one file"
repository = "https://github.com/santamadaraneilande-ctrl/seviathstudio"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "6"
eframe = "0.36"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
quick-xml = "0.42.0"
rayon = "1"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5.2.9"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

[build-dependencies]
winresource = "0.1"
