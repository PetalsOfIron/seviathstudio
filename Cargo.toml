[package]
name = "seviathstudio"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "6"
eframe = "0.36"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
